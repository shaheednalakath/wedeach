<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — n1 &amp; n2</title>
<meta name="description" content="Every photo from Shaheed and Shahana's wedding celebration, gathered in one gallery.">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <nav class="site-nav" aria-label="Primary">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <span class="seal" aria-hidden="true">S&amp;S</span>
        n1 &amp; 
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html" aria-current="page">Gallery</a></li>
        <li><a href="videos.html">Videos</a></li>
        <li><a href="story.html">Our Story</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </nav>
</header>

<main>

  <!-- ===================== Hero ===================== -->
  <section class="page-hero">
    <div class="container">

      <p class="eyebrow">Captured Moments</p>

      <h1 class="section-title">
        Our Beautiful Gallery
      </h1>

      <p class="section-sub" style="margin-inline:auto;">
        Every picture tells a story, every smile holds a memory, and every moment reminds us of the beautiful journey we share together.
      </p>

    </div>
  </section>

  <!-- ===================== Gallery ===================== -->
  <section class="section" style="padding-top:0;">
    <div class="container">

      <!-- Search & Counter -->
      <div class="gallery-toolbar">

        <div class="search-field">

          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.8">

            <circle cx="11" cy="11" r="7"></circle>
            <path d="M21 21l-4.3-4.3"></path>

          </svg>

          <input
            type="search"
            data-gallery-search
            placeholder="Search memories..."
            aria-label="Search Photos">

        </div>

        <span class="gallery-count" data-gallery-count>
          Loading...
        </span>

      </div>

      <!-- Masonry Gallery -->
      <div
        class="masonry"
        data-masonry
        aria-live="polite">
      </div>

      <!-- Empty / Error Message -->
      <div
        class="state-msg"
        data-gallery-state
        style="display:none;">
      </div>

    </div>
  </section>

</main>
<!-- ===================== Lightbox ===================== -->
<div class="lightbox" data-lightbox aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lightbox-stage">
    <img data-lightbox-image src="" alt="">
    <p class="lightbox-caption" data-lightbox-caption></p>
  </div>
  <button class="lightbox-close" data-lightbox-close aria-label="Close photo viewer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="lightbox-nav lightbox-prev" data-lightbox-prev aria-label="Previous photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <button class="lightbox-nav lightbox-next" data-lightbox-next aria-label="Next photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</div>

<footer class="site-footer">
  <div class="container footer-inner">
    <a href="index.html" class="brand"><span class="seal" aria-hidden="true">S&amp;S</span> n1 &amp; n2</a>
    <ul class="footer-social">
      <li><a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg></a></li>
      <li><a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 9h3V6h-3c-2 0-3 1.2-3 3v2H8v3h3v6h3v-6h3l1-3h-4V9c0-.6.4-1 1-1z"/></svg></a></li>
      <li><a href="#" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 12a8 8 0 1 1-3.8-6.8L20 4l-1 3.6A8 8 0 0 1 20 12z"/><path d="M8.5 9.5c.3 2.5 2.5 4.7 5 5"/></svg></a></li>
    </ul>
    <p class="footer-fine">&copy; <span data-year></span> n1 &amp; n2. Made with <span class="made-with">&hearts;</span></p>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
