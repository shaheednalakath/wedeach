      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Join Us</p>
      <h1 class="section-title">Contact &amp; Venue</h1>
      <p class="section-sub" style="margin-inline:auto;">We can't wait to celebrate with you. Here's everything you need to find us.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="contact-grid">

        <div class="contact-card glass reveal">
          <p class="eyebrow" style="margin-bottom:1rem;">Details</p>

          <div class="info-row">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-5-9-9a5 5 0 0 1 9-4 5 5 0 0 1 9 4c-2 4-9 9-9 9z"/></svg></span>
            <div>
              <h4>Venue</h4>
              <p id="venueName"></p>
              <p id="venueAddress"></p>
            </div>
          </div>

          <div class="info-row">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 3a2 2 0 0 1-.4 2.1L8 10.1a16 16 0 0 0 6 6l1.3-1.4a2 2 0 0 1 2.1-.4c1 .4 2 .6 3 .7a2 2 0 0 1 1.6 2z"/></svg></span>
            <div>
              <h4>Phone</h4>
              <p><a id="venuePhone" href="#"></a></p>
            </div>
          </div>

          <div class="info-row">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h16v16H4z"/><path d="M4 6l8 7 8-7"/></svg></span>
            <div>
              <h4>Email</h4>
              <p><a id="venueEmail" href="#"></a></p>
            </div>
          </div>

          <div class="mt-lg">
            <a id="mapsBtn" href="#" target="_blank" rel="noopener" class="btn btn-solid">
              Open in Google Maps
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17L17 7M7 7h10v10"/></svg>
            </a>
          </div>
        </div>

        <div class="map-frame reveal reveal-delay-1">
          <iframe id="mapEmbed" src="" loading="lazy" title="Venue location map" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <a href="index.html" class="brand"><span class="seal" aria-hidden="true">S&amp;S</span> Shaheed &amp; Shahana</a>
    <ul class="footer-social">
      <li><a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg></a></li>
      <li><a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 9h3V6h-3c-2 0-3 1.2-3 3v2H8v3h3v6h3v-6h3l1-3h-4V9c0-.6.4-1 1-1z"/></svg></a></li>
      <li><a href="#" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 12a8 8 0 1 1-3.8-6.8L20 4l-1 3.6A8 8 0 0 1 20 12z"/><path d="M8.5 9.5c.3 2.5 2.5 4.7 5 5"/></svg></a></li>
    </ul>
    <p class="footer-fine">&copy; <span data-year></span> Shaheed &amp; Shahana. Made with <span class="made-with">&hearts;</span></p>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
  // Populate venue details from the shared config so there's a single
  // source of truth (see js/config.js → SITE_CONFIG.venue).
  document.addEventListener("DOMContentLoaded", () => {
    const v = SITE_CONFIG.venue;
    document.getElementById("venueName").textContent = v.name;
    document.getElementById("venueAddress").textContent = `${v.addressLine1}, ${v.addressLine2}`;

    const phoneLink = document.getElementById("venuePhone");
    phoneLink.textContent = v.phone;
    phoneLink.href = `tel:${v.phone.replace(/\s+/g, "")}`;

    const emailLink = document.getElementById("venueEmail");
    emailLink.textContent = v.email;
    emailLink.href = `mailto:${v.email}`;

    document.getElementById("mapsBtn").href = v.mapsUrl;
    document.getElementById("mapEmbed").src =
      `https://maps.google.com/maps?q=${encodeURIComponent(v.name + " " + v.addressLine2)}&output=embed`;
  });
</script>
</body>
</html>
